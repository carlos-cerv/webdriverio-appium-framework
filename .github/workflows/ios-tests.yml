name: iOS Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ios-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Install Appium globally
        run: npm install -g appium appium-xcuitest-driver

      - name: Install Appium drivers
        run: |
          appium driver install xcuitest || echo "XCUITest driver already installed"

      - name: Create and Boot iOS Simulator
        run: |
          echo "Available iOS Simulators:"
          xcrun simctl list devices available
          
          # Find iPhone 15 Pro (latest available)
          SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone 15 Pro" | grep -v "unavailable" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          
          if [ -z "$SIMULATOR_ID" ]; then
            echo "iPhone 15 Pro not found, trying iPhone 15"
            SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone 15" | grep -v "unavailable" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          fi
          
          if [ -z "$SIMULATOR_ID" ]; then
            echo "Using any available iPhone simulator"
            SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone" | grep -v "unavailable" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          fi
          
          if [ -z "$SIMULATOR_ID" ]; then
            echo "ERROR: No suitable iOS simulator found"
            exit 1
          fi
          
          echo "Selected Simulator ID: $SIMULATOR_ID"
          
          # Shutdown any running simulator first
          echo "Shutting down any running simulators..."
          xcrun simctl shutdown all || true
          sleep 2
          
          # Boot the simulator
          echo "Booting simulator..."
          xcrun simctl boot $SIMULATOR_ID || echo "Simulator boot initiated"
          
          # Wait for simulator to be ready
          echo "Waiting for simulator to be ready..."
          COUNTER=0
          MAX_ATTEMPTS=40
          while [ $COUNTER -lt $MAX_ATTEMPTS ]; do
            if xcrun simctl list devices | grep "$SIMULATOR_ID" | grep -q "Booted"; then
              echo "Simulator is booted and ready"
              break
            fi
            COUNTER=$((COUNTER + 1))
            echo "Waiting... ($COUNTER/$MAX_ATTEMPTS)"
            sleep 3
          done
          
          if [ $COUNTER -eq $MAX_ATTEMPTS ]; then
            echo "WARNING: Simulator boot timeout, attempting tests anyway"
          fi
          
          echo "Final device status:"
          xcrun simctl list devices | grep Booted

      - name: Start Appium server
        run: |
          echo "Starting Appium server..."
          appium --log-level warn &
          APPIUM_PID=$!
          sleep 8
          echo "Appium server started with PID: $APPIUM_PID"
          echo "APPIUM_PID=$APPIUM_PID" >> $GITHUB_ENV

      - name: Run iOS tests
        run: npm run test:ios
        continue-on-error: true

      - name: Stop Appium server
        if: always()
        run: |
          if [ ! -z "$APPIUM_PID" ]; then
            kill $APPIUM_PID || true
            echo "Appium server stopped"
          fi

      - name: Generate Allure Report
        if: always()
        run: npm run report || echo "Report generation completed"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-artifacts
          path: |
            allure-results/
            allure-report/
            screenshots/
          retention-days: 7

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ios-reports
          keep_files: true
