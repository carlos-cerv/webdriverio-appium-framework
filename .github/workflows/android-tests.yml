name: Android Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Appium globally
        run: npm install -g appium appium-uiautomator2-driver

      - name: Create AVD and start Emulator
        run: |
          # Create Android Virtual Device if it doesn't exist
          echo "Creating AVD..."
          echo "no" | avdmanager create avd -n test_emulator -k "system-images;android;34;google_apis;arm64-v8a" -f || true
          
          # Start emulator
          echo "Starting emulator..."
          emulator -avd test_emulator -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim &
          EMULATOR_PID=$!
          
          # Wait for boot with timeout
          echo "Waiting for emulator to boot..."
          timeout 300 bash -c 'until adb devices | grep emulator; do sleep 2; done' || true
          
          # Additional wait for full boot
          for i in {1..30}; do
            BOOT_STATUS=$(adb shell getprop sys.boot_completed 2>/dev/null || echo "0")
            if [ "$BOOT_STATUS" = "1" ]; then
              echo "Emulator ready"
              break
            fi
            echo "Waiting for boot... ($i/30)"
            sleep 2
          done
          
          echo "EMULATOR_PID=$EMULATOR_PID" >> $GITHUB_ENV

      - name: Run Android tests
        run: |
          echo "Starting Appium server..."
          appium --log-level warn &
          APPIUM_PID=$!
          sleep 5
          
          echo "Running tests..."
          npm run test:android || TEST_RESULT=$?
          
          kill $APPIUM_PID || true
          exit ${TEST_RESULT:-0}
        continue-on-error: true

      - name: Stop Emulator
        if: always()
        run: |
          if [ ! -z "$EMULATOR_PID" ]; then
            kill $EMULATOR_PID || true
            echo "Emulator stopped"
          fi

      - name: Generate Allure Report
        if: always()
        run: npm run report || echo "Report generation completed"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-artifacts
          path: |
            allure-results/
            allure-report/
            screenshots/
          retention-days: 7

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: android-reports
          keep_files: true
